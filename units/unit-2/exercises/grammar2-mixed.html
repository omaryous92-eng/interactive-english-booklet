  <script>
    // QUESTIONS — EXACTLY AS IN THE BOOKLET (Pages 58-60)
    const questions = [
      { type: 'fill', text: '1. She did not use to do exercises every morning. (habit)', correct: 'She did not have the habit of doing exercises every morning.' },
      { type: 'fill', text: '2. He usually watched TV in the afternoon. (would=used to)', correct: 'He would watch TV in the afternoon.' },
      { type: 'fill', text: '3. I walked down the street. During that time, I saw an accident. (Just as)', correct: 'Just as I was walking down the street, I saw an accident.' },
      { type: 'fill', text: '4. She no longer plays tennis. (any longer)', correct: 'She doesn\'t play tennis any longer.' },
      { type: 'fill', text: '5. He has been doing his homework for three hours. (ago)', correct: 'He started doing his homework three hours ago.' },
      { type: 'fill', text: '6. I climbed trees when I was a young boy. (used)', correct: 'I used to climb trees when I was a young boy.' },
      { type: 'fill', text: '7. It isn\'t true that I made a mistake. (didn\'t)', correct: 'I didn\'t make a mistake.' },
      { type: 'fill', text: '8. The boys were in the middle of a game of cards. (playing)', correct: 'The boys were playing cards.' },
      { type: 'fill', text: '9. No one told me about the change of plan. (know)', correct: 'I didn\'t know about the change of plan.' },
      { type: 'fill', text: '10. It was my past habit to go on a long bike ride. (would)', correct: 'I would go on a long bike ride.' },
      { type: 'error', text: '11. I am <span class="error-word">get used to</span> waking up early.', correct: 'getting used to' },
      { type: 'error', text: '12. We would <span class="error-word">going</span> to the zoo every spring.', correct: 'go' },
      { type: 'error', text: '13. He used to <span class="error-word">cooks</span> dinner for the family.', correct: 'cook' },
      { type: 'error', text: '14. She is <span class="error-word">use</span> to working under pressure.', correct: 'used' }
    ];

      script3.onload = function() {
        if (typeof ExerciseEngine !== 'undefined') {
          ExerciseEngine.init(questions);

      };
      document.head.appendChild(script3);
    });
