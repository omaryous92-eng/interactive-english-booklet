  <script>
    // QUESTIONS — EXACTLY AS IN THE BOOKLET (Pages 54-55)
    const questions = [
      { type: 'fill', text: '1. The sun _______ (shine) when I _______ (get up) this morning.', correct: 'was shining, got up' },
      { type: 'fill', text: '2. While Maria _______ (paint) the wall, she _______ (drop) the brush.', correct: 'was painting, dropped' },
      { type: 'fill', text: '3. Andrew _______ (have) dinner when his mother _______ (leave) for work.', correct: 'was having, left' },
      { type: 'fill', text: '4. While Eric _______ (sleep), Elena _______ (do) the dishes.', correct: 'was sleeping, was doing' },
      { type: 'fill', text: '5. When Tania _______ (arrive), we _______ (watch) the Beauty Contest on Mega.', correct: 'arrived, were watching' },
      { type: 'fill', text: '6. Tom _______ (get) ready for school when Andrew _______ (call).', correct: 'was getting, called' },
      { type: 'fill', text: '7. Mary _______ (walk) her dog while Sally _______ (walk) her cat.', correct: 'was walking, was walking' },
      { type: 'fill', text: '8. Elena _______ (hurt) her leg while she _______ (play) volleyball.', correct: 'hurt, was playing' },
      { type: 'fill', text: '9. Andrew _______ (fall) asleep while he _______ (listen) to his favourite song.', correct: 'fell, was listening' },
      { type: 'fill', text: '10. Kim _______ (do) a puzzle while Elena _______ (study) for her test.', correct: 'was doing, was studying' }
    ];

    document.addEventListener('DOMContentLoaded', function() {
      const script1 = document.createElement('script');
      script1.src = '../../../js/sounds.js';
      document.head.appendChild(script1);
      
      const script2 = document.createElement('script');
      script2.src = '../../../js/confetti.js';
      document.head.appendChild(script2);
      
      const script3 = document.createElement('script');
      script3.src = '../../../js/exercises.js';
      script3.onload = function() {
        if (typeof ExerciseEngine !== 'undefined') {
          ExerciseEngine.init(questions);
        }
      };
      document.head.appendChild(script3);
    });
  </script>
