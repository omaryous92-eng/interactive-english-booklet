  <script>
    // QUESTIONS — EXACTLY AS IN THE BOOKLET (Page 53)
    const questions = [
      { type: 'mcq', text: '1. TV while your dad was making lunch?', options: ['Has your mum been watching', 'Your mum was watching', 'Was your mum watching', 'Has your mum watched'], correct: 'c' },
      { type: 'mcq', text: '2. I _______ Karim yesterday because I was ill.', options: ['didn\'t visited', 'don\'t visit', 'didn\'t visit', 'wasn\'t visiting'], correct: 'c' },
      { type: 'mcq', text: '3. I was washing my clothes _______ my brother was doing his homework.', options: ['once', 'since', 'when', 'while'], correct: 'd' },
      { type: 'mcq', text: '4. What time _______ home last night?', options: ['she came', 'did she come', 'she comes', 'was she coming'], correct: 'b' },
      { type: 'mcq', text: '5. Sandy was having lunch while her mother _______ dinner.', options: ['was cooking', 'is cooking', 'cooking', 'cooked'], correct: 'a' },
      { type: 'mcq', text: '6. Andrew arrived _______ and he is having a shower now.', options: ['for twenty minutes', 'twenty minutes ago', 'last twenty minutes', 'since twenty minutes'], correct: 'b' },
      { type: 'mcq', text: '7. Were you studying when I _______ you last night?', options: ['phoned', 'phones', 'was phoning', 'have phoned'], correct: 'a' },
      { type: 'mcq', text: '8. They _______ a very interesting film last night.', options: ['watched', 'are watching', 'watch', 'have watched'], correct: 'a' },
      { type: 'mcq', text: '9. I went to Italy and had a wonderful time there _______.', options: ['once a month', 'in 1998', 'this morning', 'recently'], correct: 'b' },
      { type: 'mcq', text: '10. What were you doing at three o\'clock yesterday? "I _______ a picture".', options: ['was drawing', 'am drawing', 'drew', 'have drawn'], correct: 'a' },
      { type: 'mcq', text: '11. By the time the manager arrives, we _______ the presentation.', options: ['have already started', 'were starting', 'had already started', 'started'], correct: 'c' },
      { type: 'mcq', text: '12. She _______ in five countries and still travels often.', options: ['lived', 'was living', 'has lived', 'had lived'], correct: 'c' },
      { type: 'mcq', text: '13. I _______ to contact him all day, but his phone was off.', options: ['try', 'was trying', 'have tried', 'tried'], correct: 'd' },
      { type: 'mcq', text: '14. While I _______ the document, the power went out.', options: ['was saving', 'saved', 'have saved', 'save'], correct: 'a' },
      { type: 'mcq', text: '15. They _______ the results of the survey yet.', options: ['didn\'t receive', 'haven\'t received', 'weren\'t receiving', 'don\'t receive'], correct: 'b' }
    ];

    document.addEventListener('DOMContentLoaded', function() {

      script1.src = '../../../js/sounds.js';

        if (typeof ExerciseEngine !== 'undefined') {
          ExerciseEngine.init(questions);
        }
      };
      document.head.appendChild(script3);
    });
  </script>
