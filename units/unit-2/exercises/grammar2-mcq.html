  <script>
    // QUESTIONS — EXACTLY AS IN THE BOOKLET (Page 58)
    const questions = [
      { type: 'mcq', text: '1. _______ your geography project yet? "No, but I\'m almost done."', options: ['Did you finish', 'Are you finished', 'Have you finished', 'Have you been finishing'], correct: 'c' },
      { type: 'mcq', text: '2. _______ English in Japan? "Yes, but that was many years ago."', options: ['Would she teach', 'Did she used to teach', 'Has she been teaching', 'Did she use to teach'], correct: 'd' },
      { type: 'mcq', text: '3. Bobby _______ Indian food, but he does now.', options: ['wouldn\'t eat', 'didn\'t used to eat', 'wasn\'t eating', 'hasn\'t eaten'], correct: 'b' },
      { type: 'mcq', text: '4. What _______ when her taxi for the airport arrived? "She was still packing."', options: ['has Carol done', 'was Carol doing', 'did Carol do', 'is Carol doing'], correct: 'b' },
      { type: 'mcq', text: '5. Mum _______ to The Netherlands at 6 o\'clock this morning.', options: ['flies', 'has flown', 'has been flying', 'was flying'], correct: 'd' },
      { type: 'mcq', text: '6. TV while your dad was making lunch?', options: ['Has your mum been watching', 'Your mum was watching', 'Was your mum watching', 'Has your mum watched'], correct: 'c' },
      { type: 'mcq', text: '7. Bernard and his wife _______ in China at that time; they were in the US.', options: ['hasn\'t lived', 'wasn\'t living', 'weren\'t living', 'aren\'t living'], correct: 'c' },
      { type: 'mcq', text: '8. Are you used to _______ before you go to bed?', options: ['read', 'be read', 'reading', 'be reading'], correct: 'c' },
      { type: 'mcq', text: '9. Don\'t worry! You will soon _______ living in such a crowded city.', options: ['be used to', 'get used to', 'used to', 'to get used to'], correct: 'b' },
      { type: 'mcq', text: '10. Maria _______ lunch yet.', options: ['didn\'t prepare', 'is preparing', 'hasn\'t prepared', 'wasn\'t preparing'], correct: 'c' }
    ];

    document.addEventListener('DOMContentLoaded', function() {
      const script1 = document.createElement('script');
      script1.src = '../../../js/sounds.js';
      document.head.appendChild(script1);
      
      const script2 = document.createElement('script');

      document.head.appendChild(script2);
      
      const script3 = document.createElement('script');
      script3.src = '../../../js/exercises.js';
      script3.onload = function() {
        if (typeof ExerciseEngine !== 'undefined') {
          ExerciseEngine.init(questions);
        }
      };
      document.head.appendChild(script3);
    });
  </script>
