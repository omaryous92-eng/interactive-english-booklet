<!DOCTYPE html>

  <!-- Global CSS -->
  <link rel="stylesheet" href="../../../css/colors.css">

</head>
<body>

  <!-- Header / Mobile Nav omitted -->

  <main class="main-content">
    <section class="section">
      <div class="container">

        <nav class="breadcrumbs">
          <a href="../../../index.html">Home</a>
          <span class="separator"> › </span>
          <a href="../index.html">Unit 2</a>
          <span class="separator"> › </span>
          <a href="index.html">Exercises</a>
          <span class="separator"> › </span>
          <span class="current">Vocab 1: Fill</span>
        </nav>

        <div class="exercise-container">
          <div class="exercise-header">
            <div class="exercise-title">📝 Vocabulary 1 — Fill in the Blank</div>
            <div class="exercise-meta">
              <span class="badge badge-primary">10 Questions</span>
              <span class="score-display">⭐ Score: <span id="score-display">0</span></span>
            </div>
          </div>

          <div class="progress-container" id="progress-container">
            <div class="progress-bar">
              <div class="progress-fill" id="progress-fill"></div>
            </div>
            <div class="progress-text">
              <span id="progress-text">0 / 10</span>
            </div>
          </div>

          <div id="question-container"></div>

          <div class="nav-buttons" id="nav-buttons">
            <button class="btn-nav btn-prev" id="btn-prev" onclick="ExerciseEngine.prevQuestion()">← Previous</button>
            <button class="btn-nav btn-next" id="btn-next" onclick="ExerciseEngine.nextQuestion()">Next Question →</button>
          </div>

          <div style="margin-top: var(--spacing-8);">
            <a href="index.html" class="btn btn-secondary">← Back to Exercises</a>
          </div>
        </div>

        <footer style="margin-top: var(--spacing-12); padding-top: var(--spacing-6); border-top: 2px solid var(--color-border); text-align: center; color: var(--color-text-secondary); font-size: var(--font-size-sm);">
          <p>© 2026 · Interactive E-Book · Unit 2 · Vocab 1 Fill</p>
        </footer>

      </div>
    </section>
  </main>

  <script>
    // QUESTIONS — EXACTLY AS IN THE BOOKLET (Page 45)
    const questions = [
      { type: 'fill', text: '1. I need someone to be the _______ and sign the certificate at my wedding.', correct: 'witness' },
      { type: 'fill', text: '2. We invited 50 guests to our wedding _______.', correct: 'reception' },
      { type: 'fill', text: '3. Musicians play an important _______ in our culture.', correct: 'role' },
      { type: 'fill', text: '4. It is rare to see people dressed in the national _______ nowadays.', correct: 'costume' },
      { type: 'fill', text: '5. According to the _______, there is a treasure hidden at the bottom of the lake.', correct: 'legend' },
      { type: 'fill', text: '6. Ali had a _______ that covered his face so no one was able to recognize him.', correct: 'mask' },
      { type: 'fill', text: '7. The music festival is _______ every year in the spring.', correct: 'held' },
      { type: 'fill', text: '8. My father has a _______ reputation as a skilled architect.', correct: 'built' },
      { type: 'fill', text: '9. In the US, it is a _______ to have fireworks on the 4th of July.', correct: 'tradition' },
      { type: 'fill', text: '10. My dad gave a very touching _______ at my wedding that brought tears to my eyes.', correct: 'speech' }
    ];

    document.addEventListener('DOMContentLoaded', function() {
      const script1 = document.createElement('script');
      script1.src = '../../../js/sounds.js';
      document.head.appendChild(script1);
      
      const script2 = document.createElement('script');
      script2.src = '../../../js/confetti.js';
      document.head.appendChild(script2);
      
      const script3 = document.createElement('script');
      script3.src = '../../../js/exercises.js';
      script3.onload = function() {
        if (typeof ExerciseEngine !== 'undefined') {
          ExerciseEngine.init(questions);
        }
      };
      document.head.appendChild(script3);
    });
  </script>

  <script src="../../../js/main.js"></script>
  <script src="../../../js/navigation.js"></script>

</body>
</html>
