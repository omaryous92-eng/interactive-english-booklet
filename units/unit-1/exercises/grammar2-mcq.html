  <script>
    // QUESTIONS — EXACTLY AS IN THE BOOKLET (Page 29)
    const questions = [
      { type: 'mcq', text: '1. I ________ three emails this morning, but I still haven\'t received a reply.', options: ['have sent', 'have been sending', 'was sending', 'am sending'], correct: 'a' },
      { type: 'mcq', text: '2. She looks exhausted because she ________ since 6 a.m.', options: ['worked', 'has worked', 'has been working', 'had worked'], correct: 'c' },
      { type: 'mcq', text: '3. We ________ to that teacher three times about the issue, but nothing has changed.', options: ['have spoken', 'have been speaking', 'were speaking', 'are speaking'], correct: 'a' },
      { type: 'mcq', text: '4. I ________ this song on repeat for over an hour. It\'s stuck in my head!', options: ['have listened', 'have been listening', 'am listening', 'had been listening'], correct: 'b' },
      { type: 'mcq', text: '5. How long ________ in this neighborhood?', options: ['have you lived', 'have you been living', 'do you live', 'are you living'], correct: 'a' },
      { type: 'mcq', text: '6. He ________ in five different countries so far.', options: ['has lived', 'has been living', 'lived', 'lives'], correct: 'a' },
      { type: 'mcq', text: '7. I ________ to contact you all day, but your phone has been off.', options: ['have tried', 'have been trying', 'was trying', 'tried'], correct: 'a' },
      { type: 'mcq', text: '8. She ________ ten chapters already. She\'s so fast!', options: ['has been reading', 'has read', 'read', 'had read'], correct: 'b' },
      { type: 'mcq', text: '9. Why ________ so many breaks lately?', options: ['have you taken', 'have you been taking', 'did you take', 'do you take'], correct: 'a' },
      { type: 'mcq', text: '10. We ________ about this issue for weeks and still can\'t agree.', options: ['have discussed', 'have been discussing', 'are discussing', 'had been discussing'], correct: 'b' },
      { type: 'mcq', text: '11. She ________ the same question again and again. I think she\'s just testing me.', options: ['has asked', 'has been asking', 'asked', 'asks'], correct: 'b' },
      { type: 'mcq', text: '12. We ________ ten pages of the report, and we still have five more to go.', options: ['have been reading', 'have read', 'read', 'had read'], correct: 'b' },
      { type: 'mcq', text: '13. I ________ this sofa for years, and it\'s finally breaking.', options: ['have had', 'have been having', 'had', 'was having'], correct: 'a' },
      { type: 'mcq', text: '14. My hands are dirty because I ________ in the garden.', options: ['have dug', 'have been digging', 'dug', 'was digging'], correct: 'b' },
      { type: 'mcq', text: '15. He ________ to improve his writing by reading one article a day.', options: ['has tried', 'has been trying', 'tried', 'tries'], correct: 'a' },
      { type: 'mcq', text: '16. I ________ here since I graduated, and I don\'t plan on leaving soon.', options: ['have worked', 'have been working', 'work', 'worked'], correct: 'a' },
      { type: 'mcq', text: '17. They ________ so hard lately. They deserve a break.', options: ['have worked', 'have been working', 'are working', 'had worked'], correct: 'b' },
      { type: 'mcq', text: '18. We ________ any feedback yet, so we\'re still waiting.', options: ['haven\'t been getting', 'haven\'t got', 'haven\'t received', 'didn\'t get'], correct: 'c' },
      { type: 'mcq', text: '19. I ________ to understand this problem, but it\'s really confusing.', options: ['have been trying', 'tried', 'have tried', 'had tried'], correct: 'a' },
      { type: 'mcq', text: '20. He ________ the same mistake three times this week.', options: ['has made', 'has been making', 'makes', 'is making'], correct: 'a' }
    ];

    document.addEventListener('DOMContentLoaded', function() {
      const script1 = document.createElement('script');
      script1.src = '../../../js/sounds.js';
      document.head.appendChild(script1);
      
      const script2 = document.createElement('script');
      script2.src = '../../../js/confetti.js';
      document.head.appendChild(script2);
      
      const script3 = document.createElement('script');
      script3.src = '../../../js/exercises.js';
      script3.onload = function() {
        if (typeof ExerciseEngine !== 'undefined') {
          ExerciseEngine.init(questions);
        }
      };
      document.head.appendChild(script3);
    });
  </script>

  <script src="../../../js/main.js"></script>
  <script src="../../../js/navigation.js"></script>
