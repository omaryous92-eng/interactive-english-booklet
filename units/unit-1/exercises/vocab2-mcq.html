  <script>
    // QUESTIONS — EXACTLY AS IN THE BOOKLET (Pages 11-12)
    const questions = [
      { type: 'mcq', text: '1. You need to understand the ________ of the sentence to guess the meaning of the word.', options: ['context', 'interruption', 'embarrassment', 'decade'], correct: 'a' },
      { type: 'mcq', text: '2. I tripped in front of everyone and felt great _______.', options: ['embarrassment', 'research', 'relief', 'condition'], correct: 'a' },
      { type: 'mcq', text: '3. How did he ________ when you told him the news?', options: ['sight', 'respond', 'benefit', 'suffer'], correct: 'b' },
      { type: 'mcq', text: '4. One ________ of exercising regularly is better sleep.', options: ['guilt', 'frustration', 'benefit', 'bug'], correct: 'c' },
      { type: 'mcq', text: '5. The sunset from the hilltop was a beautiful _______.', options: ['joy', 'sight', 'condition', 'supply'], correct: 'b' },
      { type: 'mcq', text: '6. When you\'re tired, you often ________ without realizing it.', options: ['supply', 'wonder', 'yawn', 'relief'], correct: 'c' },
      { type: 'mcq', text: '7. A ________ is a period of ten years.', options: ['yawn', 'interruption', 'decade', 'sympathy'], correct: 'c' },
      { type: 'mcq', text: '8. She opened the gift in complete _______.', options: ['frustration', 'despair', 'amazement', 'anxiety'], correct: 'c' },
      { type: 'mcq', text: '9. Many children ________ from anxiety before exams.', options: ['benefit', 'chew', 'suffer', 'wonder'], correct: 'c' },
      { type: 'mcq', text: '10. Waiting for hours caused a lot of _______.', options: ['frustration', 'yawn', 'supply', 'embarrassment'], correct: 'a' },
      { type: 'mcq', text: '11. The ________ of clean water after the storm was a big issue.', options: ['supply', 'context', 'benefit', 'anxiety'], correct: 'a' },
      { type: 'mcq', text: '12. Before her performance, she was filled with _______.', options: ['behavior', 'anxiety', 'sight', 'bug'], correct: 'b' },
      { type: 'mcq', text: '13. I tripped over the stairs and felt ________ all day.', options: ['guilt', 'public transport', 'yawn', 'despair'], correct: 'a' },
      { type: 'mcq', text: '14. We shared a moment of true ________ when our team won.', options: ['sight', 'yawn', 'joy', 'decade'], correct: 'c' },
      { type: 'mcq', text: '15. He couldn\'t stop himself from feeling deep ________ after yelling at his friend.', options: ['relief', 'yawn', 'guilt', 'interruption'], correct: 'c' },
      { type: 'mcq', text: '16. The teacher smiled in ________ when the shy student finally spoke up.', options: ['sympathy', 'condition', 'context', 'suffer'], correct: 'a' },
      { type: 'mcq', text: '17. It\'s hard to trust him because he\'s not very _______.', options: ['reliable', 'optimistic', 'mature', 'stubborn'], correct: 'a' },
      { type: 'mcq', text: '18. He was ________ after hearing the news that he lost his job.', options: ['overjoyed', 'stubborn', 'furious', 'sensitive'], correct: 'c' },
      { type: 'mcq', text: '19. His ________ behavior made it difficult to guess what he would do next.', options: ['unpredictable', 'unpleasant', 'unreliable', 'predictable'], correct: 'a' },
      { type: 'mcq', text: '20. I was too ________ to concentrate during the test.', options: ['distracted', 'sensitive', 'packed', 'delayed'], correct: 'a' },
      { type: 'mcq', text: '21. I couldn\'t focus with all that ________ talking in the background.', options: ['noisily', 'seriously', 'closely', 'extremely'], correct: 'a' },
      { type: 'mcq', text: '22. I worked ________ with my teacher to improve my grades.', options: ['closely', 'noisily', 'seriously', 'extremely'], correct: 'a' },
      { type: 'mcq', text: '23. That child was extremely ________ and refused to listen to anyone.', options: ['stubborn', 'optimistic', 'calm', 'sensitive'], correct: 'a' },
      { type: 'mcq', text: '24. The student behaved ________ and refused to follow any instructions.', options: ['loyal', 'childish', 'reliable', 'mature'], correct: 'b' },
      { type: 'mcq', text: '25. She deals with problems in a very ________ way for her age.', options: ['childish', 'aggressive', 'mature', 'unreliable'], correct: 'c' }

          ExerciseEngine.init(questions);
