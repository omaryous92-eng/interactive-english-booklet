  <script>
    // QUESTIONS — EXACTLY AS IN THE BOOKLET (Pages 8-9)
    const questions = [
      { type: 'mcq', text: '1. She suffers from a heart _______ that requires regular medication.', options: ['amazement', 'guilt', 'condition', 'supply'], correct: 'c' },
      { type: 'mcq', text: '2. We can reduce traffic if more people use _______.', options: ['public transport', 'behavior', 'joy', 'interruption'], correct: 'a' },
      { type: 'mcq', text: '3. That kind of noise can really _______ some people who have misophonia.', options: ['bug', 'prevent', 'sight', 'respond'], correct: 'a' },
      { type: 'mcq', text: '4. I felt deep _______ for the injured puppy.', options: ['benefit', 'sympathy', 'decade', 'sight'], correct: 'b' },
      { type: 'mcq', text: '5. Scientists are doing _______ to find a cure for the disease.', options: ['despair', 'respond', 'research', 'misophonia'], correct: 'c' },
      { type: 'mcq', text: '6. Don\'t _______ with your mouth open; it\'s impolite.', options: ['bug', 'chew', 'benefit', 'suffer'], correct: 'b' },
      { type: 'mcq', text: '7. Don\'t _______ your brother while he\'s studying.', options: ['bug', 'decade', 'guilt', 'context'], correct: 'a' },
      { type: 'mcq', text: '8. The speaker continued despite the sudden _______.', options: ['behavior', 'interruption', 'research', 'supply'], correct: 'b' },
      { type: 'mcq', text: '9. I always _______ how birds can find their way across continents.', options: ['wonder', 'yawn', 'prevent', 'chew'], correct: 'a' },
      { type: 'mcq', text: '10. People with _______ find everyday sounds like chewing unbearable.', options: ['frustration', 'misophonia', 'sight', 'joy'], correct: 'b' },
      { type: 'mcq', text: '11. I didn\'t mean to _______ you, but I had to tell you the bad news.', options: ['chew', 'yawn', 'upset', 'benefit'], correct: 'c' },
      { type: 'mcq', text: '12. His rude _______ shocked everyone at the meeting.', options: ['behavior', 'joy', 'despair', 'bug'], correct: 'a' },
      { type: 'mcq', text: '13. Washing your hands can _______ the spread of germs.', options: ['suffer', 'benefit', 'prevent', 'research'], correct: 'c' },
      { type: 'mcq', text: '14. The news of her recovery brought him great _______.', options: ['despair', 'relief', 'bug', 'embarrassment'], correct: 'b' },
      { type: 'mcq', text: '15. He felt deep _______ after losing all hope.', options: ['supply', 'misophonia', 'despair', 'behaviour'], correct: 'c' },
      { type: 'mcq', text: '16. He always speaks _______ about important issues.', options: ['noisily', 'constantly', 'closely', 'seriously'], correct: 'd' },
      { type: 'mcq', text: '17. The chemicals in this product are very _______ to the environment.', options: ['tolerable', 'harmful', 'harmless', 'reliable'], correct: 'b' },
      { type: 'mcq', text: '18. He remained _______ even when others were angry.', options: ['furious', 'calm', 'harmful', 'annoying'], correct: 'b' },
      { type: 'mcq', text: '19. I felt _______ disappointed when I saw my test result.', options: ['extremely', 'closely', 'noisily', 'seriously'], correct: 'a' },
      { type: 'mcq', text: '20. My flight was _______ due to the weather conditions.', options: ['delayed', 'optimistic', 'annoying', 'loyal'], correct: 'a' },
      { type: 'mcq', text: '21. She acted so _______ that no one wanted to sit near her.', options: ['overjoyed', 'calm', 'aggressive', 'loyal'], correct: 'c' },
      { type: 'mcq', text: '22. That mosquito noise was really _______ while I was trying to study.', options: ['irritating', 'predictable', 'distracting', 'delayed'], correct: 'a' },
      { type: 'mcq', text: '23. His _______ remarks made everyone feel hurt.', options: ['mean', 'loyal', 'sensitive', 'calm'], correct: 'a' },
      { type: 'mcq', text: '24. This restaurant is always _______ on weekends.', options: ['packed', 'unpleasant', 'harmful', 'tolerable'], correct: 'a' },
      { type: 'mcq', text: '25. Her _______ attitude made her classmates avoid her.', options: ['mature', 'sensitive', 'arrogant', 'loyal'], correct: 'c' }
    ];

    // Initialize the exercise engine
    document.addEventListener('DOMContentLoaded', function() {
      // Load scripts
      const script1 = document.createElement('script');
      script1.src = '../../../js/sounds.js';
      document.head.appendChild(script1);
      
      const script2 = document.createElement('script');
      script2.src = '../../../js/confetti.js';
      document.head.appendChild(script2);
      
      const script3 = document.createElement('script');
      script3.src = '../../../js/exercises.js';
      script3.onload = function() {
        if (typeof ExerciseEngine !== 'undefined') {
          ExerciseEngine.init(questions);
        }
      };
      document.head.appendChild(script3);
    });
  </script>

  <script src="../../../js/main.js"></script>
  <script src="../../../js/navigation.js"></script>
