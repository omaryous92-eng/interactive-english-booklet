  <script>
    // QUESTIONS — EXACTLY AS IN THE BOOKLET (Pages 31-33)
    const questions = [
      { type: 'mcq', text: '1. Derek ________ flowers for his mom every Mother\'s Day.', options: ['buys', 'to buy', 'has bought', 'buying'], correct: 'a' },
      { type: 'mcq', text: '2. We usually ________ to the beach with our friends every week.', options: ['have gone', 'going', 'goes', 'go'], correct: 'd' },
      { type: 'mcq', text: '3. The Sun ________ in the east and ________ in the west.', options: ['rising, setting', 'rises, sets', 'rise, set', 'to rise, to set'], correct: 'b' },
      { type: 'mcq', text: '4. Tom and Linda ________ the subway train to work every day.', options: ['takes', 'took', 'take', 'have taken'], correct: 'c' },
      { type: 'mcq', text: '5. He ________ the car at the moment.', options: ['is washing', 'are washing', 'washed', 'has washed'], correct: 'a' },
      { type: 'mcq', text: '6. Shh! Be quiet. The baby ________ now.', options: ['sleeps', 'has slept', 'are sleeping', 'is sleeping'], correct: 'd' },
      { type: 'mcq', text: '7. I ________ him since yesterday morning.', options: ['didn\'t see', 'hasn\'t seen', 'haven\'t seen', 'haven\'t seeing'], correct: 'c' },
      { type: 'mcq', text: '8. The Prime Minister ________ a speech on television right now.', options: ['is giving', 'was give', 'are giving', 'has given'], correct: 'a' },
      { type: 'mcq', text: '9. We ________ just ________ cleaning the kitchen.', options: ['finished', 'have finished', 'finish', 'are finishing'], correct: 'b' },
      { type: 'mcq', text: '10. For three hours, Jim ________ for his mother at the airport.', options: ['have waited', 'is waiting', 'waited', 'has waited'], correct: 'd' },
      { type: 'mcq', text: '11. Lauren and Sarah ________ Spanish with Mrs. Andersen right now.', options: ['are studying', 'is studying', 'will study', 'studied'], correct: 'a' },
      { type: 'mcq', text: '12. So far, he ________ anything to make me feel bad.', options: ['haven\'t done', 'having done', 'hasn\'t done', 'hadn\'t done'], correct: 'c' },
      { type: 'mcq', text: '13. Since I last saw him, he ________ in London.', options: ['lived', 'is living', 'lives', 'has been living'], correct: 'd' },
      { type: 'mcq', text: '14. We can\'t open the door, Jack ________ it and it is still wet.', options: ['is painting', 'painted', 'has painted', 'paints'], correct: 'c' },
      { type: 'mcq', text: '15. I have been waiting for you _______.', options: ['since 2 minutes', 'since 9 a.m.', 'for two o\'clock', 'for yesterday'], correct: 'b' },
      { type: 'fill', text: '16. Look! It ________ (rain) outside.', correct: 'is raining' },
      { type: 'fill', text: '17. How long ________ she ________ (work) there when you met her?', correct: 'had, worked' },
      { type: 'error', text: '18. My teacher <span class="error-word">have</span> given me a lot of homework to do.', correct: 'has' },
      { type: 'fill', text: '19. I am still doing my homework. (yet)', correct: 'I haven\'t finished my homework yet.' },
      { type: 'fill', text: '20. My dog and I ________ (run) all day.', correct: 'have been running' }
    ];

    document.addEventListener('DOMContentLoaded', function() {
      const script1 = document.createElement('script');
      script1.src = '../../../js/sounds.js';
      document.head.appendChild(script1);
      
      const script2 = document.createElement('script');
      script2.src = '../../../js/confetti.js';
      document.head.appendChild(script2);
      
      const script3 = document.createElement('script');
      script3.src = '../../../js/exercises.js';
      script3.onload = function() {
        if (typeof ExerciseEngine !== 'undefined') {
          ExerciseEngine.init(questions);
        }
      };
      document.head.appendChild(script3);
    });
  </script>

  <script src="../../../js/main.js"></script>
  <script src="../../../js/navigation.js"></script>
