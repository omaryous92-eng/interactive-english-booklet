      { type: 'error', text: '2. The students <span class="error-word">are usually studying</span> in the library at 8 a.m.', correct: 'usually study' },
      { type: 'error', text: '3. My sister <span class="error-word">is hating</span> loud music, especially early in the morning.', correct: 'hates' },

      { type: 'error', text: '9. She <span class="error-word">talks</span> on the phone right now. Can I take a message?', correct: 'is talking' },
      { type: 'error', text: '10. I think this dish <span class="error-word">is tasting</span> awful.', correct: 'tastes' },
      { type: 'fill', text: '11. I ________ (see) what you mean, but I still ________ (disagree) with the conclusion.', correct: 'see, disagree' },
