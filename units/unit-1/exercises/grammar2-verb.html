  <script>
    // QUESTIONS — EXACTLY AS IN THE BOOKLET (Pages 29-30)
    const questions = [
      { type: 'fill', text: '1. I ________ (take) a French course for 5 months and the teacher says I am a fast learner.', correct: 'have been taking' },
      { type: 'fill', text: '2. Someone ________ (leave) the ladder outside, look.', correct: 'has left' },
      { type: 'fill', text: '3. I expect that\'s Brain. He ________ (clean) windows. And I don\'t think he ________ (finish) yet.', correct: 'has been cleaning, has finished' },
      { type: 'fill', text: '4. Elsa ________ (take) driving lessons and next week she is going to take a driving test.', correct: 'has been taking' },
      { type: 'fill', text: '5. I ________ (live) in Sue\'s flat and when I find a new house, I will move.', correct: 'have been living' },
      { type: 'fill', text: '6. Please don\'t go in. I just ________ (sweep) the floor.', correct: 'have swept' },
      { type: 'fill', text: '7. I ________ (eat) 8 chocolates up to now.', correct: 'have eaten' },
      { type: 'fill', text: '8. Are you hungry? No, I\'m not. I ________ (eat) chocolate all day.', correct: 'have been eating' },
      { type: 'fill', text: '9. The young children ________ (make) a snowman all morning.', correct: 'have been making' },
      { type: 'fill', text: '10. I ________ (break) my arms twice within 2 years.', correct: 'have broken' },
      { type: 'fill', text: '11. I\'m tired. I ________ (play) tennis all afternoon.', correct: 'have been playing' },
      { type: 'fill', text: '12. My father ________ (work) very hard recently.', correct: 'has been working' }
    ];

    document.addEventListener('DOMContentLoaded', function() {

      script3.src = '../../../js/exercises.js';
      script3.onload = function() {
        if (typeof ExerciseEngine !== 'undefined') {
          ExerciseEngine.init(questions);
        }
      };
      document.head.appendChild(script3);
    });
  </script>
