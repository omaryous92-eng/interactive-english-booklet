  <script>
    // QUESTIONS — EXACTLY AS IN THE BOOKLET (Page 104)
    const questions = [
      { type: 'mcq', text: '1. Don\'t make _______ spelling mistakes.', options: ['much', 'many', 'lots', 'a lot'], correct: 'b' },
      { type: 'mcq', text: '2. There aren\'t _______ chips on the table.', options: ['some', 'little', 'any', 'no'], correct: 'c' },
      { type: 'mcq', text: '3. Would you like _______ tea?', options: ['some', 'many', 'any', 'much'], correct: 'a' },
      { type: 'mcq', text: '4. He didn\'t miss _______ of his friends.', options: ['some', 'any', 'few', 'much'], correct: 'b' },
      { type: 'mcq', text: '5. He didn\'t manage to learn _______ information.', options: ['many', 'some', 'much', 'no'], correct: 'c' },
      { type: 'mcq', text: '6. There is still _______ tart in the fridge.', options: ['a little', 'some', 'any', 'a few'], correct: 'a' },
      { type: 'mcq', text: '7. Arabic _______ more difficult than English.', options: ['is', 'are', 'were', 'have'], correct: 'a' },
      { type: 'mcq', text: '8. Unfortunately, there _______ recycling bins on this street.', options: ['are a little', 'aren\'t many', 'is a few', 'aren\'t much'], correct: 'b' },
      { type: 'mcq', text: '9. My new flat is very nice because it\'s got _______ natural light.', options: ['lot of', 'lots of', 'a lots of', 'a lot'], correct: 'b' },
      { type: 'mcq', text: '10. I have _______ money. However, I can buy my needs.', options: ['little', 'a little', 'few', 'many'], correct: 'b' },
      { type: 'mcq', text: '11. How _______ seconds are there in an hour?', options: ['much', 'many', 'little', 'few'], correct: 'b' },
      { type: 'mcq', text: '12. We didn\'t take _______ photographs yesterday.', options: ['some', 'many', 'much', 'little'], correct: 'b' },
      { type: 'mcq', text: '13. They didn\'t do _______ shopping last week.', options: ['a', 'much', 'many', 'some'], correct: 'b' },
      { type: 'mcq', text: '14. She has _______ problem. Can you help her?', options: ['a', 'a few', 'any', 'a lot'], correct: 'a' },
      { type: 'mcq', text: '15. He hasn\'t got _______ furniture in his house.', options: ['lot of', 'some', 'any', 'many'], correct: 'c' }
    ];

    document.addEventListener('DOMContentLoaded', function() {

      script3.onload = function() {
        if (typeof ExerciseEngine !== 'undefined') {
          ExerciseEngine.init(questions);

      };
      document.head.appendChild(script3);
    });
