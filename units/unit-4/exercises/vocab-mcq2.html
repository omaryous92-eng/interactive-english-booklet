    const questions = [
      { type: 'mcq', text: '1. I\'d prefer to live in a _______ building rather than a tower block.', options: ['high rise', 'low-rise', 'block of flats', 'industrial'], correct: 'b' },
      { type: 'mcq', text: '2. The story doesn\'t move in a/an _______ fashion; it begins with the death of the hero.', options: ['linear', 'entertaining', 'uninviting', 'historical'], correct: 'a' },
      { type: 'mcq', text: '3. The _______ of the company led to many new employees being hired.', options: ['pace', 'raise', 'venue', 'growth'], correct: 'd' },
      { type: 'mcq', text: '4. After travelling around Europe for two months, we ended _______ in Prague.', options: ['in', 'up', 'at', 'into'], correct: 'b' },
      { type: 'mcq', text: '5. When architects create a new building, they need to take the local area into _______.', options: ['attention', 'temptation', 'consideration', 'urbanisation'], correct: 'c' },
      { type: 'mcq', text: '6. My train to work is always here at 7:30 without _______.', options: ['fail', 'chance', 'regret', 'resist'], correct: 'a' },
      { type: 'mcq', text: '7. The marketing manager _______ changing the name of the company and the board of directors is discussing the matter.', options: ['demanded', 'proposed', 'claimed', 'spread'], correct: 'b' },
      { type: 'mcq', text: '8. The virus _______ quickly through physical contact.', options: ['spread', 'grew', 'expanded', 'raised'], correct: 'a' },
      { type: 'mcq', text: '9. He _______ he was very poor, but we didn\'t believe him.', options: ['proposed', 'claimed', 'demanded', 'spread'], correct: 'b' },
      { type: 'mcq', text: '10. The fence marks the _______ between our garden and our neighbours\'.', options: ['limit', 'junction', 'boundary', 'pavement'], correct: 'c' },
      { type: 'mcq', text: '11. The hotel has special _______ for disabled people.', options: ['facilities', 'estates', 'courses', 'boundaries'], correct: 'a' },
      { type: 'mcq', text: '12. There are people from all _______ of life in my dance class, from lawyers to builders and hairdressers.', options: ['talks', 'suburbs', 'walks', 'facilities'], correct: 'c' },
      { type: 'mcq', text: '13. His book collection is always _______ the increase; he must have more than 10,000 books already.', options: ['in', 'at', 'up', 'on'], correct: 'd' },
      { type: 'mcq', text: '14. She really went to _______ on her birthday party — it went on all night.', options: ['city', 'urban', 'town', 'rural'], correct: 'c' },
      { type: 'mcq', text: '15. The place looked like a _______ town with dark, empty streets.', options: ['ghost', 'urban', 'rural', 'jungle'], correct: 'a' }
    ];
