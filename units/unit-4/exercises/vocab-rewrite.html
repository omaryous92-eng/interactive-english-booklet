  <script>
    // QUESTIONS — EXACTLY AS IN THE BOOKLET (Page 91)
    const questions = [
      { type: 'fill', text: '1. It was difficult to make a decision as the situation was _______ (continuously) changing. (Rewrite with the correct form)', correct: 'continually' },
      { type: 'error', text: '2. The park is <span class="error-word">fenced</span>, so you can go and have a walk there any time you like. (Correct the error)', correct: 'unfenced' },
      { type: 'fill', text: '3. In many modern cities, people have to live very close to each other, as housing is limited. (Rewrite with a suitable expression)', correct: 'live on top of each other' },
      { type: 'fill', text: '4. Cities aren\'t usually as _______ (walk) as smaller towns. (Use the correct form)', correct: 'walkable' },
      { type: 'error', text: '5. The hotel looked cold and <span class="error-word">inviting</span>; we definitely didn\'t want to stay there. (Correct the error)', correct: 'uninviting' },
      { type: 'fill', text: '6. I couldn\'t stop myself from eating some more chocolate cake. (Rewrite with a suitable expression)', correct: 'I couldn\'t resist the temptation to eat more chocolate cake.' }
    ];

    document.addEventListener('DOMContentLoaded', function() {
      const script1 = document.createElement('script');
      script1.src = '../../../js/sounds.js';
      document.head.appendChild(script1);
      const script2 = document.createElement('script');
      script2.src = '../../../js/confetti.js';
      document.head.appendChild(script2);
      const script3 = document.createElement('script');
      script3.src = '../../../js/exercises.js';
      script3.onload = function() {
        if (typeof ExerciseEngine !== 'undefined') {
          ExerciseEngine.init(questions);
        }
      };
      document.head.appendChild(script3);
    });
  </script>

  <script src="../../../js/main.js"></script>
