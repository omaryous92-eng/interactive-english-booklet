  <script>
    // QUESTIONS — EXACTLY AS IN THE BOOKLET (Page 98)
    const questions = [
      { type: 'fill', text: '1. Aaron is carrying two tyres — he _______ (change) the tyres on a car.', correct: 'is going to change' },
      { type: 'fill', text: '2. Do you think the teacher _______ (mark) our homework by Monday morning?', correct: 'will have marked' },
      { type: 'fill', text: '3. By the time we get home, the football match _______ (start).', correct: 'will have started' },
      { type: 'fill', text: '4. You\'re carrying too much. I _______ (open) the door for you.', correct: 'will open' },
      { type: 'fill', text: '5. I\'ve just checked the flight details and the plane _______ (arrive) at 6pm.', correct: 'arrives' },
      { type: 'fill', text: '6. I don\'t think you _______ (have) any problems when you land in Boston.', correct: 'will have' },
      { type: 'fill', text: '7. By the time we get home, they _______ (play) football for 30 minutes.', correct: 'will have been playing' },
      { type: 'fill', text: '8. Look at the clouds — it _______ (rain) in a few minutes.', correct: 'is going to rain' }
    ];
