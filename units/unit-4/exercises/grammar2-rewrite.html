  <script>
    // QUESTIONS — EXACTLY AS IN THE BOOKLET (Pages 105-106)
    const questions = [
      { type: 'fill', text: '1. He didn\'t buy any water. (some)', correct: 'He bought some water.' },
      { type: 'fill', text: '2. He didn\'t know much information about this program. (pieces)', correct: 'He didn\'t know many pieces of information about this program.' },
      { type: 'fill', text: '3. The police caught some robbers. (any)', correct: 'The police didn\'t catch any robbers.' },
      { type: 'fill', text: '4. He needs some juice. (a)', correct: 'He needs a glass of juice.' },
      { type: 'fill', text: '5. She hasn\'t got much milk in the fridge. (a little)', correct: 'She has got a little milk in the fridge.' },
      { type: 'fill', text: '6. I drank a little tea this morning. (cup)', correct: 'I drank a cup of tea this morning.' },
      { type: 'fill', text: '7. There isn\'t much sugar in the bowl. (a packet)', correct: 'There isn\'t a packet of sugar in the bowl.' },
      { type: 'fill', text: '8. I\'ve got a few books to read this week. (some)', correct: 'I\'ve got some books to read this week.' },
      { type: 'fill', text: '9. He didn\'t give me any advice. (piece)', correct: 'He didn\'t give me a piece of advice.' },
      { type: 'fill', text: '10. They served soup to all the guests. (bowls)', correct: 'They served bowls of soup to all the guests.' }
    ];

    document.addEventListener('DOMContentLoaded', function() {
      const script1 = document.createElement('script');
      script1.src = '../../../js/sounds.js';
      document.head.appendChild(script1);

      const script3 = document.createElement('script');
      script3.src = '../../../js/exercises.js';
      script3.onload = function() {
        if (typeof ExerciseEngine !== 'undefined') {
          ExerciseEngine.init(questions);
        }
      };
      document.head.appendChild(script3);
    });
  </script>
