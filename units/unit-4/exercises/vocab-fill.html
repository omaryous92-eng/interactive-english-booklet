<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vocab Fill · Unit 4 · Exercises</title>

  <!-- Global CSS -->
  <link rel="stylesheet" href="../../../css/colors.css">
  <link rel="stylesheet" href="../../../css/variables.css">
  <link rel="stylesheet" href="../../../css/reset.css">
  <link rel="stylesheet" href="../../../css/layout.css">
  <link rel="stylesheet" href="../../../css/navigation.css">
  <link rel="stylesheet" href="../../../css/components.css">
  <link rel="stylesheet" href="../../../css/animations.css">
  <link rel="stylesheet" href="../../../css/responsive.css">
  <link rel="stylesheet" href="../../../css/exercises.css">
</head>
<body>

  <!-- Header / Mobile Nav omitted -->

  <main class="main-content">
    <section class="section">
      <div class="container">

        <nav class="breadcrumbs">
          <a href="../../../index.html">Home</a>
          <span class="separator"> › </span>
          <a href="../index.html">Unit 4</a>
          <span class="separator"> › </span>
          <a href="index.html">Exercises</a>
          <span class="separator"> › </span>
          <span class="current">Vocabulary: Fill</span>
        </nav>

        <div class="exercise-container">
          <div class="exercise-header">
            <div class="exercise-title">📝 Vocabulary — Fill in the Blank</div>
            <div class="exercise-meta">
              <span class="badge badge-primary">10 Questions</span>
              <span class="score-display">⭐ Score: <span id="score-display">0</span></span>
            </div>
          </div>

          <div class="progress-container" id="progress-container">
            <div class="progress-bar">
              <div class="progress-fill" id="progress-fill"></div>
            </div>
            <div class="progress-text">
              <span id="progress-text">0 / 10</span>
            </div>
          </div>

          <div id="question-container"></div>

          <div class="nav-buttons" id="nav-buttons">
            <button class="btn-nav btn-prev" id="btn-prev" onclick="ExerciseEngine.prevQuestion()">← Previous</button>
            <button class="btn-nav btn-next" id="btn-next" onclick="ExerciseEngine.nextQuestion()">Next Question →</button>
          </div>

          <div style="margin-top: var(--spacing-8);">
            <a href="index.html" class="btn btn-secondary">← Back to Exercises</a>
          </div>
        </div>

        <footer style="margin-top: var(--spacing-12); padding-top: var(--spacing-6); border-top: 2px solid var(--color-border); text-align: center; color: var(--color-text-secondary); font-size: var(--font-size-sm);">
          <p>© 2026 · Interactive E-Book · Unit 4 · Vocab Fill</p>
        </footer>

      </div>
    </section>
  </main>

  <script>
    // QUESTIONS — EXACTLY AS IN THE BOOKLET (Page 94)
    const questions = [
      { type: 'fill', text: '1. Don\'t drive fast here, there are lots of _______.', correct: 'speed cameras' },
      { type: 'fill', text: '2. When the _______ is red, you have to stop.', correct: 'traffic light' },
      { type: 'fill', text: '3. There will be _______ next week, so we will need to find another route to go to work.', correct: 'roadworks' },
      { type: 'fill', text: '4. Cyclists are happy because of the new _______ in the city.', correct: 'bike lane' },
      { type: 'fill', text: '5. Go straight on when you reach the _______. You will find my car parked on the right.', correct: 'crossroads' },
      { type: 'fill', text: '6. My town needs more _______ like schools, cinemas and _______.', correct: 'facilities, commercial areas' },
      { type: 'fill', text: '7. My city has over 100,000 _______. It is very crowded and noisy.', correct: 'inhabitants' },
      { type: 'fill', text: '8. This is a dangerous road because it is busy and there isn\'t a _______.', correct: 'pedestrian crossing' },
      { type: 'fill', text: '9. The _______ is 30km/h here, so watch out or else you will be fined.', correct: 'speed limit' },
      { type: 'fill', text: '10. The stadium is a great _______ for rock concerts as well as big sporting events.', correct: 'venue' }
    ];

    document.addEventListener('DOMContentLoaded', function() {
      const script1 = document.createElement('script');
      script1.src = '../../../js/sounds.js';
      document.head.appendChild(script1);
      const script2 = document.createElement('script');
      script2.src = '../../../js/confetti.js';
      document.head.appendChild(script2);
      const script3 = document.createElement('script');
      script3.src = '../../../js/exercises.js';
      script3.onload = function() {
        if (typeof ExerciseEngine !== 'undefined') {
          ExerciseEngine.init(questions);
        }
      };
      document.head.appendChild(script3);
    });
  </script>

  <script src="../../../js/main.js"></script>
  <script src="../../../js/navigation.js"></script>

</body>
</html>
