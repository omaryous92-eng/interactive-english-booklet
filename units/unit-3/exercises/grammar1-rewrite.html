  <script>
    // QUESTIONS — EXACTLY AS IN THE BOOKLET (Pages 75-76)
    const questions = [
      { type: 'fill', text: '1. She ate her breakfast and she went to work. (after)', correct: 'After she had eaten her breakfast, she went to work.' },
      { type: 'fill', text: '2. He had been following me for 2 hours before I noticed him. (How long?)', correct: 'How long had he been following you before you noticed him?' },
      { type: 'fill', text: '3. I bought a new car and started taking driving lessons. (had)', correct: 'I had bought a new car before I started taking driving lessons.' },
      { type: 'fill', text: '4. She fell asleep before the end of the film. (By the time)', correct: 'By the time the film ended, she had fallen asleep.' },
      { type: 'fill', text: '5. The twins had been fighting all day before their dad arrived. (Rewrite in question form)', correct: 'Had the twins been fighting all day before their dad arrived?' },
      { type: 'fill', text: '6. He won the Oscar and retired. (before)', correct: 'He had won the Oscar before he retired.' },
      { type: 'fill', text: '7. I had lunch then I drank tea. (before)', correct: 'I had drunk tea before I had lunch.' },
      { type: 'fill', text: '8. By the time I arrived at the cinema, the film had started. (After)', correct: 'After I arrived at the cinema, the film had started.' },
      { type: 'fill', text: '9. I left the house and then it started to rain. (As soon as)', correct: 'As soon as I had left the house, it started to rain.' },
      { type: 'fill', text: '10. I didn\'t go to bed until I had had my supper. (After)', correct: 'After I had had my supper, I went to bed.' },
      { type: 'fill', text: '11. First, he finished his work. Then, he left the office. (until)', correct: 'He didn\'t leave the office until he had finished his work.' },
      { type: 'fill', text: '12. Nabil did his homework, then he watched TV. (before)', correct: 'Nabil had done his homework before he watched TV.' }
    ];

    document.addEventListener('DOMContentLoaded', function() {
      const script1 = document.createElement('script');
      script1.src = '../../../js/sounds.js';
      document.head.appendChild(script1);
      
      const script2 = document.createElement('script');

      document.head.appendChild(script2);
      
      const script3 = document.createElement('script');
      script3.src = '../../../js/exercises.js';
      script3.onload = function() {
        if (typeof ExerciseEngine !== 'undefined') {
          ExerciseEngine.init(questions);
        }
      };
      document.head.appendChild(script3);
    });
  </script>
