    const questions = [
      { type: 'fill', text: '1. She became very successful, although she came from a poor background. (open doors for herself)', correct: 'She opened doors for herself despite her poor background.' },
      { type: 'fill', text: '2. The actor disappeared for years and suddenly became popular again. (comeback)', correct: 'The actor made a comeback after disappearing for years.' },
      { type: 'fill', text: '3. I couldn\'t stop talking about the shocking event. (scandal)', correct: 'I couldn\'t stop talking about the scandal.' },
      { type: 'fill', text: '4. Everyone knew his name after he broke the world record. (household name)', correct: 'He became a household name after breaking the world record.' },
      { type: 'fill', text: '5. She achieved success by chance, and no one expected it. (out of nowhere)', correct: 'She achieved success out of nowhere.' },
      { type: 'fill', text: '6. He did the same job his father had done years ago. (follow in his father\'s footsteps)', correct: 'He followed in his father\'s footsteps.' },
      { type: 'fill', text: '7. She couldn\'t handle the criticism. (cope with)', correct: 'She couldn\'t cope with the criticism.' },
      { type: 'fill', text: '8. His only reason for becoming famous was a viral dance. (claim to fame)', correct: 'His claim to fame was a viral dance.' },
      { type: 'fill', text: '9. He pushed himself forward when others missed the chance. (seize the opportunity)', correct: 'He seized the opportunity when others missed it.' },
