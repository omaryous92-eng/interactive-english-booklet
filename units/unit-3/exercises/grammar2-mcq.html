  <script>
    // QUESTIONS — EXACTLY AS IN THE BOOKLET (Page 77)
    const questions = [
      { type: 'mcq', text: '1. Before the tribe allowed outsiders to join the ceremony, they _______ their trust slowly over time.', options: ['built', 'had been building', 'had built', 'were building'], correct: 'c' },
      { type: 'mcq', text: '2. She _______ the traditional costume before the presenter even introduced her to the stage.', options: ['had worn', 'wore', 'had been wearing', 'wears'], correct: 'a' },
      { type: 'mcq', text: '3. The archaeologists _______ for days before they found any sign of the lost village.', options: ['searched', 'had been searching', 'had searched', 'were searching'], correct: 'b' },
      { type: 'mcq', text: '4. As soon as the dancer entered, I knew I _______ her somewhere before.', options: ['had seen', 'saw', 'had been seeing', 'was seeing'], correct: 'a' },
      { type: 'mcq', text: '5. He _______ the role of tribal leader during a difficult time in their history.', options: ['took', 'had taken', 'was taking', 'had been taken'], correct: 'a' },
      { type: 'mcq', text: '6. By the time we got to the exhibition, they _______ the ritual demonstration.', options: ['had finished', 'finished', 'had been finishing', 'were finishing'], correct: 'a' },
      { type: 'mcq', text: '7. She _______ about ancient traditions in her journal every day for a year before she published the book.', options: ['had written', 'wrote', 'had been writing', 'was writing'], correct: 'c' },
      { type: 'mcq', text: '8. The fashion designer _______ for months on the new tartan patterns before revealing them.', options: ['worked', 'had worked', 'had been working', 'works'], correct: 'c' },
      { type: 'mcq', text: '9. We were surprised to see that the cultural artifacts _______ so poorly over time.', options: ['had preserved', 'preserved', 'had not preserved', 'had not been preserved'], correct: 'd' },
      { type: 'mcq', text: '10. After they _______ the final bonfire, the crowd slowly began to leave.', options: ['lit', 'had lit', 'had been lighting', 'were lighting'], correct: 'b' }
    ];

          ExerciseEngine.init(questions);
        }

    });
