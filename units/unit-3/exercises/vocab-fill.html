<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vocab Fill · Unit 3 · Exercises</title>

  <!-- Global CSS -->
  <link rel="stylesheet" href="../../../css/colors.css">
  <link rel="stylesheet" href="../../../css/variables.css">
  <link rel="stylesheet" href="../../../css/reset.css">
  <link rel="stylesheet" href="../../../css/layout.css">
  <link rel="stylesheet" href="../../../css/navigation.css">
  <link rel="stylesheet" href="../../../css/components.css">
  <link rel="stylesheet" href="../../../css/animations.css">
  <link rel="stylesheet" href="../../../css/responsive.css">
  <link rel="stylesheet" href="../../../css/exercises.css">
</head>
<body>

  <!-- Header / Mobile Nav omitted -->

  <main class="main-content">
    <section class="section">
      <div class="container">

        <nav class="breadcrumbs">
          <a href="../../../index.html">Home</a>
          <span class="separator"> › </span>
          <a href="../index.html">Unit 3</a>
          <span class="separator"> › </span>
          <a href="index.html">Exercises</a>
          <span class="separator"> › </span>
          <span class="current">Vocabulary: Fill</span>
        </nav>

        <div class="exercise-container">
          <div class="exercise-header">
            <div class="exercise-title">📝 Vocabulary — Fill in the Blank</div>
            <div class="exercise-meta">
              <span class="badge badge-primary">10 Questions</span>
              <span class="score-display">⭐ Score: <span id="score-display">0</span></span>
            </div>
          </div>

          <div class="progress-container" id="progress-container">
            <div class="progress-bar">
              <div class="progress-fill" id="progress-fill"></div>
            </div>
            <div class="progress-text">
              <span id="progress-text">0 / 10</span>
            </div>
          </div>

          <div id="question-container"></div>

          <div class="nav-buttons" id="nav-buttons">
            <button class="btn-nav btn-prev" id="btn-prev" onclick="ExerciseEngine.prevQuestion()">← Previous</button>
            <button class="btn-nav btn-next" id="btn-next" onclick="ExerciseEngine.nextQuestion()">Next Question →</button>
          </div>

          <div style="margin-top: var(--spacing-8);">
            <a href="index.html" class="btn btn-secondary">← Back to Exercises</a>
          </div>
        </div>

        <footer style="margin-top: var(--spacing-12); padding-top: var(--spacing-6); border-top: 2px solid var(--color-border); text-align: center; color: var(--color-text-secondary); font-size: var(--font-size-sm);">
          <p>© 2026 · Interactive E-Book · Unit 3 · Vocab Fill</p>
        </footer>

      </div>
    </section>
  </main>

  <script>
    // QUESTIONS — EXACTLY AS IN THE BOOKLET (Page 71)
    const questions = [
      { type: 'fill', text: '1. The athlete will _______ to break the world record.', correct: 'attempt' },
      { type: 'fill', text: '2. The school received a large _______ to improve its science labs.', correct: 'donation' },
      { type: 'fill', text: '3. A strange _______ spread quickly around the village.', correct: 'rumour' },
      { type: 'fill', text: '4. She tried to _______ her classmates by giving a powerful speech.', correct: 'inspire' },
      { type: 'fill', text: '5. We had to _______ clean water from a distant well.', correct: 'fetch' },
      { type: 'fill', text: '6. He worked hard to _______ his fear of public speaking.', correct: 'overcome' },
      { type: 'fill', text: '7. It\'s not easy to _______ with constant pressure from social media.', correct: 'cope' },
      { type: 'fill', text: '8. She began to _______ in mathematics by the end of the year.', correct: 'excel' },
      { type: 'fill', text: '9. The coach tried to _______ the team before the match.', correct: 'motivate' },
      { type: 'fill', text: '10. Parents should encourage their children rather than _______ them.', correct: 'criticise' }
    ];

    document.addEventListener('DOMContentLoaded', function() {
      const script1 = document.createElement('script');
      script1.src = '../../../js/sounds.js';
      document.head.appendChild(script1);
      
      const script2 = document.createElement('script');
      script2.src = '../../../js/confetti.js';
      document.head.appendChild(script2);
      
      const script3 = document.createElement('script');
      script3.src = '../../../js/exercises.js';
      script3.onload = function() {
        if (typeof ExerciseEngine !== 'undefined') {
          ExerciseEngine.init(questions);
        }
      };
      document.head.appendChild(script3);
    });
  </script>

  <script src="../../../js/main.js"></script>
  <script src="../../../js/navigation.js"></script>

</body>
</html>
