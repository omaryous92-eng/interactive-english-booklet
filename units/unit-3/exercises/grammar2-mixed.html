  <script>
    // QUESTIONS — EXACTLY AS IN THE BOOKLET (Pages 78-79)
    const questions = [
      { type: 'fill', text: '1. While I _______ (walk) home, the manager _______ (call) me.', correct: 'was walking, called' },
      { type: 'fill', text: '2. The teacher _______ (be) angry because the students _______ (not - do) their homework.', correct: 'was, had not done' },
      { type: 'fill', text: '3. They _______ (tell) us that they _______ (not - see) us before.', correct: 'told, had not seen' },
      { type: 'fill', text: '4. The teacher _______ (speak) to the new student yet.', correct: 'has not spoken' },
      { type: 'fill', text: '5. They _______ (chat) on the phone since 12:30 and they _______ (not - finish) yet.', correct: 'have been chatting, have not finished' },
      { type: 'fill', text: '6. Too many species _______ (die) out in the past decades.', correct: 'have died' },
      { type: 'fill', text: '7. How many books _______ (read) in your life?', correct: 'have you read' },
      { type: 'fill', text: '8. They _______ (meet) in 2004 where they _______ (study) in university.', correct: 'met, were studying' },
      { type: 'fill', text: '9. It all _______ (happen) while they _______ (have) dinner.', correct: 'happened, were having' },
      { type: 'fill', text: '10. The Romans _______ (conquer) Britain in 43 AD.', correct: 'conquered' },
      { type: 'fill', text: '11. A friend of mine said she _______ (never - see) The Matrix.', correct: 'had never seen' },
      { type: 'fill', text: '12. We _______ (know) each other for more than 20 years.', correct: 'have known' },
      { type: 'fill', text: '13. After she _______ (finish) watching the film, she _______ (switch) off the TV.', correct: 'had finished, switched' },
      { type: 'fill', text: '14. Before she _______ (come) home, she _______ (visit) her aunt.', correct: 'came, had visited' },
      { type: 'fill', text: '15. What _______ (you - do) when the accident happened?', correct: 'were you doing' },
      { type: 'fill', text: '16. I _______ (wait) in the office for more than two hours when the Boss finally arrived.', correct: 'had been waiting' },
      { type: 'fill', text: '17. They _______ (talk) for over an hour before the other members arrived.', correct: 'had been talking' },
      { type: 'fill', text: '18. _______ (you - watch) the match when I telephoned you?', correct: 'Were you watching' },
      { type: 'fill', text: '19. She _______ (work) for that company for three years when it went out of business.', correct: 'had been working' },
      { type: 'fill', text: '20. How long _______ (you - wait) for John before he finally arrived?', correct: 'had you been waiting' }
    ];

      const script1 = document.createElement('script');
      script1.src = '../../../js/sounds.js';

      script3.src = '../../../js/exercises.js';
      script3.onload = function() {
        if (typeof ExerciseEngine !== 'undefined') {
          ExerciseEngine.init(questions);
        }
      };
      document.head.appendChild(script3);
    });
  </script>
