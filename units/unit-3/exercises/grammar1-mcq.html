  <script>
    // QUESTIONS — EXACTLY AS IN THE BOOKLET (Page 74)
    const questions = [
      { type: 'mcq', text: '1. She _______ in that remote village for three years before she published her study on tribal traditions.', options: ['had lived', 'lived', 'was living', 'has lived'], correct: 'a' },
      { type: 'mcq', text: '2. When the performance began, the audience _______ in their seats, waiting eagerly.', options: ['sat', 'had sat', 'had been sitting', 'were sitting'], correct: 'd' },
      { type: 'mcq', text: '3. The historian _______ about ancient rituals long before they became a subject of global interest.', options: ['had written', 'was writing', 'wrote', 'had been written'], correct: 'a' },
      { type: 'mcq', text: '4. They _______ the costumes on stage by the time we arrived at the theatre.', options: ['had already worn', 'were already wearing', 'had already been wearing', 'had already put on'], correct: 'd' },
      { type: 'mcq', text: '5. The tribe\'s chief _______ for his role in preserving the community\'s oral history.', options: ['had long been respected', 'has long respected', 'long respected', 'was long respecting'], correct: 'a' },
      { type: 'mcq', text: '6. By the time the cannon was fired, the soldiers _______ into their final positions.', options: ['had moved', 'moved', 'had been moving', 'move'], correct: 'a' },
      { type: 'mcq', text: '7. He was tired because he _______ in the parade all afternoon under the sun.', options: ['had been marching', 'marched', 'had marched', 'marches'], correct: 'a' },
      { type: 'mcq', text: '8. After the festival _______, they reflected on its cultural impact.', options: ['had ended', 'ended', 'was ending', 'has ended'], correct: 'a' },
      { type: 'mcq', text: '9. The dancers _______ for over thirty minutes when the power suddenly went out.', options: ['had danced', 'danced', 'had been dancing', 'were dancing'], correct: 'c' },
      { type: 'mcq', text: '10. I didn\'t recognize her at first because I _______ her in traditional costume before.', options: ['hadn\'t seen', 'didn\'t see', 'haven\'t seen', 'wasn\'t seeing'], correct: 'a' }
    ];
