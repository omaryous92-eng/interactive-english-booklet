<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🕵️ Mystery Word · Vocabulary Detective</title>

  <style>
    /* ============================================================
       GLOBAL STYLES
    ============================================================ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0D1326;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-image: radial-gradient(ellipse at 20% 50%, rgba(242, 101, 34, 0.15), transparent 60%),
                        radial-gradient(ellipse at 80% 50%, rgba(124, 92, 252, 0.1), transparent 60%);
    }

    /* ============================================================
       GAME CONTAINER
    ============================================================ */
    .game-container {
      background: linear-gradient(145deg, #1A1F3A, #0F1428);
      border-radius: 32px;
      padding: 40px;
      max-width: 820px;
      width: 100%;
      margin: 20px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(242, 101, 34, 0.1) inset;
      position: relative;
      overflow: hidden;
    }

    .game-container::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at 30% 40%, rgba(242, 101, 34, 0.03), transparent 70%);
      animation: bgPulse 8s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes bgPulse {
      0%, 100% { transform: scale(1); opacity: 0.5; }
      50% { transform: scale(1.2); opacity: 1; }
    }

    /* ============================================================
       HEADER
    ============================================================ */
    .game-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      position: relative;
      z-index: 2;
    }

    .game-title {
      font-size: 28px;
      font-weight: 800;
      background: linear-gradient(135deg, #F26522, #FFB830);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: none;
      display: flex;
      align-items: center;
      gap: 10px;
      animation: titleGlow 3s ease-in-out infinite;
    }

    @keyframes titleGlow {
      0%, 100% { filter: drop-shadow(0 0 20px rgba(242, 101, 34, 0.2)); }
      50% { filter: drop-shadow(0 0 40px rgba(242, 101, 34, 0.4)); }
    }

    .game-title span {
      -webkit-text-fill-color: initial;
      color: #fff;
    }

    .score-display {
      background: rgba(255, 255, 255, 0.06);
      padding: 8px 20px;
      border-radius: 100px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 16px;
      color: #fff;
      font-weight: 600;
      animation: scorePulse 2s ease-in-out infinite;
    }

    @keyframes scorePulse {
      0%, 100% { border-color: rgba(255, 255, 255, 0.08); }
      50% { border-color: rgba(242, 101, 34, 0.3); }
    }

    .score-display .score-number {
      color: #FFB830;
      font-size: 24px;
      font-weight: 800;
      min-width: 30px;
      text-align: center;
    }

    /* ============================================================
       DETECTIVE CHARACTER
    ============================================================ */
    .detective-container {
      display: flex;
      justify-content: center;
      margin: 10px 0 20px 0;
      position: relative;
      z-index: 2;
    }

    .detective {
      width: 120px;
      height: 120px;
      position: relative;
      animation: detectiveFloat 3s ease-in-out infinite;
    }

    @keyframes detectiveFloat {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(2deg); }
    }

    .detective .head {
      width: 80px;
      height: 80px;
      background: radial-gradient(circle at 40% 35%, #F5D0B8, #D4A88C);
      border-radius: 50%;
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .detective .hat {
      width: 90px;
      height: 35px;
      background: linear-gradient(180deg, #2C3E6B, #1A2A4A);
      border-radius: 100px 100px 0 0;
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    .detective .hat-brim {
      width: 100px;
      height: 10px;
      background: #2C3E6B;
      border-radius: 50%;
      position: absolute;
      top: 30px;
      left: 50%;
      transform: translateX(-50%);
    }

    .detective .eye-left,
    .detective .eye-right {
      width: 12px;
      height: 14px;
      background: #1A2A4A;
      border-radius: 50%;
      position: absolute;
      top: 30px;
      animation: eyeMove 4s ease-in-out infinite;
    }

    .detective .eye-left {
      left: 22px;
    }

    .detective .eye-right {
      right: 22px;
    }

    @keyframes eyeMove {
      0%, 100% { transform: scale(1); }
      25% { transform: scale(1.2); }
      50% { transform: scale(1); }
      75% { transform: scale(0.8); }
    }

    .detective .eye-left::after,
    .detective .eye-right::after {
      content: '';
      width: 4px;
      height: 4px;
      background: #fff;
      border-radius: 50%;
      position: absolute;
      top: 3px;
      left: 4px;
    }

    .detective .mouth {
      width: 18px;
      height: 8px;
      border-bottom: 3px solid #8B6B5A;
      border-radius: 0 0 50% 50%;
      position: absolute;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      animation: mouthMove 2s ease-in-out infinite;
    }

    @keyframes mouthMove {
      0%, 100% { border-bottom-width: 3px; }
      50% { border-bottom-width: 5px; }
    }

    .detective .magnifier {
      position: absolute;
      bottom: -10px;
      right: -10px;
      font-size: 40px;
      animation: magnifierSwing 3s ease-in-out infinite;
      filter: drop-shadow(0 4px 15px rgba(242, 101, 34, 0.3));
    }

    @keyframes magnifierSwing {
      0%, 100% { transform: rotate(-5deg) scale(1); }
      50% { transform: rotate(5deg) scale(1.1); }
    }

    .detective .thought-bubble {
      position: absolute;
      top: -30px;
      right: -30px;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(10px);
      padding: 6px 14px;
      border-radius: 20px 20px 20px 4px;
      font-size: 14px;
      color: #FFB830;
      font-weight: 600;
      animation: thoughtPop 2s ease-in-out infinite;
      border: 1px solid rgba(255, 184, 48, 0.15);
      opacity: 0;
    }

    .detective .thought-bubble.show {
      opacity: 1;
    }

    @keyframes thoughtPop {
      0%, 100% { transform: scale(0.9); opacity: 0; }
      10%, 90% { transform: scale(1); opacity: 1; }
    }

    /* ============================================================
       TIMER
    ============================================================ */
    .timer-section {
      margin: 16px 0 24px 0;
      position: relative;
      z-index: 2;
    }

    .timer-bar-track {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 100px;
      overflow: hidden;
      position: relative;
    }

    .timer-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #EA580C, #F26522, #FFB830);
      border-radius: 100px;
      width: 100%;
      transition: width 0.1s linear;
      position: relative;
    }

    .timer-bar-fill::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
      animation: shimmer 1s ease-in-out infinite;
    }

    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    .timer-bar-fill.warning {
      background: linear-gradient(90deg, #FF3B30, #EA580C);
      animation: timerPulse 0.5s ease-in-out infinite;
    }

    @keyframes timerPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .timer-info {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.5);
      font-weight: 500;
    }

    .timer-number {
      font-size: 20px;
      font-weight: 800;
      color: #fff;
      transition: color 0.3s;
    }

    .timer-number.warning {
      color: #FF3B30;
      animation: numberPulse 0.5s ease-in-out infinite;
    }

    @keyframes numberPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.2); }
    }

    /* ============================================================
       CLUES
    ============================================================ */
    .clues-container {
      background: rgba(255, 255, 255, 0.03);
      border-radius: 20px;
      padding: 24px;
      margin: 16px 0 24px 0;
      border: 1px solid rgba(255, 255, 255, 0.05);
      position: relative;
      z-index: 2;
      min-height: 120px;
      transition: all 0.5s ease;
    }

    .clues-container.revealing {
      animation: clueReveal 0.6s ease;
    }

    @keyframes clueReveal {
      0% { transform: scale(0.95); opacity: 0.3; }
      50% { transform: scale(1.02); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }

    .clue-item {
      font-size: 18px;
      color: rgba(255, 255, 255, 0.7);
      padding: 10px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      opacity: 0;
      transform: translateX(-20px);
      transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .clue-item.visible {
      opacity: 1;
      transform: translateX(0);
    }

    .clue-item:last-child {
      border-bottom: none;
    }

    .clue-item .clue-number {
      display: inline-block;
      background: rgba(242, 101, 34, 0.15);
      color: #F26522;
      font-weight: 700;
      font-size: 12px;
      padding: 2px 10px;
      border-radius: 100px;
      margin-right: 12px;
    }

    .clue-item .clue-text {
      font-weight: 400;
      letter-spacing: 0.3px;
    }

    /* ============================================================
       OPTIONS
    ============================================================ */
    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 20px 0;
      position: relative;
      z-index: 2;
    }

    .option-btn {
      padding: 16px 20px;
      background: rgba(255, 255, 255, 0.04);
      border: 2px solid rgba(255, 255, 255, 0.06);
      border-radius: 16px;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      text-align: center;
      position: relative;
      overflow: hidden;
      letter-spacing: 0.3px;
    }

    .option-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, rgba(242, 101, 34, 0.1), transparent);
      opacity: 0;
      transition: opacity 0.3s;
    }

    .option-btn:hover:not(:disabled) {
      transform: translateY(-3px) scale(1.02);
      border-color: rgba(242, 101, 34, 0.4);
      box-shadow: 0 8px 30px rgba(242, 101, 34, 0.15);
    }

    .option-btn:hover:not(:disabled)::before {
      opacity: 1;
    }

    .option-btn:active:not(:disabled) {
      transform: scale(0.95);
    }

    .option-btn:disabled {
      cursor: not-allowed;
      opacity: 0.5;
      transform: none !important;
    }

    .option-btn .option-letter {
      display: inline-block;
      width: 28px;
      height: 28px;
      line-height: 28px;
      text-align: center;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 50%;
      font-size: 12px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.4);
      margin-right: 10px;
      transition: all 0.3s;
    }

    .option-btn:hover:not(:disabled) .option-letter {
      background: rgba(242, 101, 34, 0.2);
      color: #F26522;
    }

    /* Option States */
    .option-btn.correct {
      border-color: #34C759;
      background: rgba(52, 199, 89, 0.15);
      animation: correctPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .option-btn.correct .option-letter {
      background: #34C759;
      color: #fff;
    }

    @keyframes correctPop {
      0% { transform: scale(1); }
      30% { transform: scale(1.1); }
      60% { transform: scale(0.95); }
      100% { transform: scale(1); }
    }

    .option-btn.wrong {
      border-color: #FF3B30;
      background: rgba(255, 59, 48, 0.15);
      animation: wrongShake 0.5s ease;
    }

    .option-btn.wrong .option-letter {
      background: #FF3B30;
      color: #fff;
    }

    @keyframes wrongShake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-10px); }
      40% { transform: translateX(10px); }
      60% { transform: translateX(-5px); }
      80% { transform: translateX(5px); }
    }

    .option-btn.show-correct {
      border-color: #34C759;
      background: rgba(52, 199, 89, 0.08);
      animation: correctReveal 0.6s ease;
    }

    .option-btn.show-correct .option-letter {
      background: #34C759;
      color: #fff;
    }

    @keyframes correctReveal {
      0% { transform: scale(0.9); opacity: 0.5; }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); opacity: 1; }
    }

    /* ============================================================
       CONTROL BUTTONS
    ============================================================ */
    .controls {
      display: flex;
      gap: 14px;
      justify-content: center;
      margin-top: 20px;
      position: relative;
      z-index: 2;
      flex-wrap: wrap;
    }

    .btn-start {
      padding: 14px 48px;
      background: linear-gradient(135deg, #F26522, #EA580C);
      border: none;
      border-radius: 100px;
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 4px 30px rgba(242, 101, 34, 0.3);
      display: flex;
      align-items: center;
      gap: 10px;
      letter-spacing: 0.5px;
    }

    .btn-start:hover:not(:disabled) {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 8px 50px rgba(242, 101, 34, 0.4);
    }

    .btn-start:active:not(:disabled) {
      transform: scale(0.95);
    }

    .btn-start:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none !important;
    }

    .btn-start .icon {
      font-size: 22px;
      animation: iconBounce 2s ease-in-out infinite;
    }

    @keyframes iconBounce {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.2); }
    }

    .btn-next {
      padding: 14px 36px;
      background: rgba(255, 255, 255, 0.06);
      border: 2px solid rgba(255, 255, 255, 0.08);
      border-radius: 100px;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      display: none;
      align-items: center;
      gap: 8px;
    }

    .btn-next:hover {
      transform: translateY(-3px);
      border-color: rgba(242, 101, 34, 0.4);
      box-shadow: 0 8px 30px rgba(242, 101, 34, 0.1);
    }

    .btn-next.show {
      display: flex;
      animation: slideUp 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes slideUp {
      0% { transform: translateY(20px); opacity: 0; }
      100% { transform: translateY(0); opacity: 1; }
    }

    /* ============================================================
       FEEDBACK OVERLAY
    ============================================================ */
    .feedback-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .feedback-overlay .emoji {
      font-size: 120px;
      animation: feedbackPop 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
      filter: drop-shadow(0 20px 60px rgba(0, 0, 0, 0.5));
    }

    @keyframes feedbackPop {
      0% { transform: scale(0) rotate(-20deg); opacity: 0; }
      60% { transform: scale(1.3) rotate(5deg); opacity: 1; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }

    /* ============================================================
       CONFETTI
    ============================================================ */
    .confetti-container {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
      z-index: 999;
      overflow: hidden;
    }

    .confetti-piece {
      position: absolute;
      width: 10px;
      height: 10px;
      animation: confettiFall linear forwards;
    }

    @keyframes confettiFall {
      0% {
        transform: translateY(-20px) rotate(0deg) scale(1);
        opacity: 1;
      }
      100% {
        transform: translateY(calc(100vh + 50px)) rotate(720deg) scale(0.3);
        opacity: 0;
      }
    }

    /* ============================================================
       GAME OVER
    ============================================================ */
    .game-over {
      text-align: center;
      padding: 30px 20px;
      position: relative;
      z-index: 2;
      animation: gameOverIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes gameOverIn {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .game-over .final-score {
      font-size: 72px;
      font-weight: 900;
      background: linear-gradient(135deg, #FFB830, #F26522);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: scoreFloat 2s ease-in-out infinite;
    }

    @keyframes scoreFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .game-over .final-label {
      font-size: 20px;
      color: rgba(255, 255, 255, 0.5);
      margin-top: 4px;
    }

    .game-over .final-message {
      font-size: 28px;
      font-weight: 700;
      color: #fff;
      margin-top: 12px;
    }

    .game-over .final-stats {
      display: flex;
      justify-content: center;
      gap: 40px;
      margin: 20px 0;
      color: rgba(255, 255, 255, 0.5);
      font-size: 14px;
    }

    .game-over .final-stats span {
      display: block;
      font-size: 28px;
      font-weight: 800;
      color: #fff;
    }

    .game-over .final-stats .correct-stat span {
      color: #34C759;
    }

    .game-over .final-stats .wrong-stat span {
      color: #FF3B30;
    }

    /* ============================================================
       RESPONSIVE
    ============================================================ */
    @media (max-width: 600px) {
      .game-container {
        padding: 20px;
        border-radius: 20px;
        margin: 10px;
      }

      .game-title {
        font-size: 20px;
      }

      .options-grid {
        grid-template-columns: 1fr;
        gap: 10px;
      }

      .option-btn {
        padding: 14px 16px;
        font-size: 14px;
      }

      .detective {
        width: 80px;
        height: 80px;
      }

      .detective .head {
        width: 55px;
        height: 55px;
        top: 8px;
      }

      .detective .hat {
        width: 60px;
        height: 25px;
      }

      .detective .hat-brim {
        width: 70px;
        height: 8px;
        top: 22px;
      }

      .detective .eye-left,
      .detective .eye-right {
        width: 8px;
        height: 10px;
        top: 22px;
      }

      .detective .eye-left { left: 15px; }
      .detective .eye-right { right: 15px; }

      .detective .mouth {
        width: 12px;
        height: 6px;
        bottom: 12px;
      }

      .detective .magnifier {
        font-size: 28px;
        bottom: -5px;
        right: -5px;
      }

      .clue-item {
        font-size: 15px;
      }

      .btn-start {
        padding: 12px 30px;
        font-size: 16px;
      }

      .game-over .final-score {
        font-size: 48px;
      }

      .feedback-overlay .emoji {
        font-size: 80px;
      }

      .score-display {
        font-size: 13px;
        padding: 6px 14px;
      }

      .score-display .score-number {
        font-size: 18px;
      }
    }

    @media (max-width: 400px) {
      .game-container {
        padding: 14px;
      }

      .game-title {
        font-size: 17px;
      }

      .game-header {
        flex-wrap: wrap;
        gap: 8px;
      }

      .clue-item {
        font-size: 13px;
        padding: 8px 0;
      }

      .controls {
        flex-direction: column;
        align-items: center;
      }

      .btn-start, .btn-next {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>
<body>

  <!-- ====== GAME ====== -->
  <div class="game-container" id="gameContainer">

    <!-- Header -->
    <div class="game-header">
      <div class="game-title">
        🕵️ <span>Mystery Word</span>
      </div>
      <div class="score-display">
        ⭐ Score: <span class="score-number" id="scoreDisplay">0</span>
      </div>
    </div>

    <!-- Detective -->
    <div class="detective-container">
      <div class="detective" id="detective">
        <div class="hat"></div>
        <div class="hat-brim"></div>
        <div class="head">
          <div class="eye-left"></div>
          <div class="eye-right"></div>
          <div class="mouth"></div>
        </div>
        <div class="magnifier">🔍</div>
        <div class="thought-bubble" id="thoughtBubble">🤔 Hmm...</div>
      </div>
    </div>

    <!-- Timer -->
    <div class="timer-section">
      <div class="timer-bar-track">
        <div class="timer-bar-fill" id="timerFill"></div>
      </div>
      <div class="timer-info">
        <span>⏱️ Time Left</span>

    // ============================================================

    let gameState = {
      words: [],
      currentIndex: 0,
      score: 0,
      total: 0,
      correct: 0,
      wrong: 0,
      answered: false,
      timer: null,
      timeLeft: 10,
      maxTime: 10,
      isRunning: false,
      isGameOver: false,
      usedWords: []

    // ============================================================
    // DOM REFS
    // ============================================================
    const $ = id => document.getElementById(id);
    const scoreDisplay = $('scoreDisplay');
    const timerFill = $('timerFill');
    const timerNumber = $('timerNumber');
    const cluesContainer = $('cluesContainer');
    const clueText1 = $('clueText1');
    const clueText2 = $('clueText2');
    const clueText3 = $('clueText3');
    const clue1 = $('clue1');
    const clue2 = $('clue2');
    const clue3 = $('clue3');
    const optTexts = [
      $('opt0'), $('opt1'), $('opt2'), $('opt3')
    ];
    const optionBtns = document.querySelectorAll('.option-btn');
    const btnStart = $('btnStart');
    const btnNext = $('btnNext');
    const thoughtBubble = $('thoughtBubble');
    const feedbackOverlay = $('feedbackOverlay');
    const feedbackEmoji = $('feedbackEmoji');
    const confettiContainer = $('confettiContainer');
    const gameContainer = $('gameContainer');

    // ============================================================
    // SOUND ENGINE (Web Audio API)
    // ============================================================
    const SoundEngine = {
      ctx: null,
      init() {
        if (!this.ctx) {
          this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
      },
      playTick() {
        this.init();
        const ctx = this.ctx;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = 600;
        gain.gain.setValueAtTime(0.08, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + 0.05);
      },
      playTickFast() {
        this.init();
        const ctx = this.ctx;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = 800;
        gain.gain.setValueAtTime(0.1, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.03);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + 0.03);
      },
      playCorrect() {
        this.init();
        const ctx = this.ctx;
        const notes = [523.25, 659.25, 783.99];
        notes.forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0.12, ctx.currentTime + i * 0.12);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.12 + 0.25);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + i * 0.12);
          osc.stop(ctx.currentTime + i * 0.12 + 0.25);
        });
      },
      playWrong() {
        this.init();
        const ctx = this.ctx;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(200, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.08, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + 0.3);
      },
      playGameOver() {
        this.init();
        const ctx = this.ctx;
        const melody = [523.25, 523.25, 523.25, 659.25, 783.99, 659.25, 783.99];
        const durations = [0.15, 0.15, 0.15, 0.15, 0.3, 0.15, 0.3];
        let time = ctx.currentTime;
        melody.forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0.1, time);
          gain.gain.exponentialRampToValueAtTime(0.001, time + durations[i]);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(time);
          osc.stop(time + durations[i]);
          time += durations[i] + 0.02;
        });
      },
      playStart() {
        this.init();
        const ctx = this.ctx;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(440, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.1, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + 0.2);
      }
    };

    // ============================================================
    // CONFETTI
    // ============================================================
    function triggerConfetti() {
      const container = confettiContainer;
      const colors = ['#F26522', '#FFB830', '#7C5CFC', '#EA580C', '#34C759', '#FF3B30', '#5AC8FA', '#FF9500'];
      for (let i = 0; i < 80; i++) {
        const el = document.createElement('div');
        el.className = 'confetti-piece';
        el.style.left = Math.random() * 100 + '%';
        el.style.background = colors[Math.floor(Math.random() * colors.length)];
        el.style.width = (Math.random() * 8 + 4) + 'px';
        el.style.height = (Math.random() * 8 + 4) + 'px';
        el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
        el.style.animationDuration = (Math.random() * 2 + 1.5) + 's';
        el.style.animationDelay = (Math.random() * 0.5) + 's';
        container.appendChild(el);
        setTimeout(() => el.remove(), 4000);
      }
    }

    // ============================================================
    // GAME FUNCTIONS
    // ============================================================
    function shuffleArray(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function getRandomWords(count = 8) {
      const shuffled = shuffleArray([...wordBank]);
      const selected = shuffled.slice(0, Math.min(count, shuffled.length));
      // Make sure we have at least 4 words
      while (selected.length < 4) {
        const extra = shuffleArray([...wordBank]).slice(0, 4 - selected.length);
        selected.push(...extra);
      }
      return selected;
    }

    function startGame() {
      // Reset game state
      gameState.words = getRandomWords(8);
      gameState.currentIndex = 0;
      gameState.score = 0;
      gameState.total = 0;
      gameState.correct = 0;
      gameState.wrong = 0;
      gameState.isGameOver = false;
      gameState.usedWords = [];

      scoreDisplay.textContent = '0';
      btnStart.disabled = true;
      btnStart.innerHTML = '<span class="icon">⏳</span> Loading...';

      setTimeout(() => {
        btnStart.innerHTML = '<span class="icon">🔍</span> Start Investigation';
        btnStart.disabled = false;
        showWord();
      }, 500);
    }

    function showWord() {
      if (gameState.currentIndex >= gameState.words.length) {
        endGame();
        return;
      }

      const wordData = gameState.words[gameState.currentIndex];
      gameState.answered = false;
      gameState.total++;

      // Reset clues
      clueText1.textContent = wordData.clues[0] || '—';
      clueText2.textContent = '—';
      clueText3.textContent = '—';
      clue1.classList.remove('visible');
      clue2.classList.remove('visible');
      clue3.classList.remove('visible');

      // Show first clue immediately
      setTimeout(() => clue1.classList.add('visible'), 100);

      // Reset options
      const allOptions = [wordData.word];
      const shuffledBank = shuffleArray([...wordBank]);
      let added = 0;
      for (const item of shuffledBank) {
        if (added >= 3) break;
        if (item.word !== wordData.word && !allOptions.includes(item.word)) {
          allOptions.push(item.word);
          added++;
        }
      }
      const shuffledOptions = shuffleArray(allOptions);

      optionBtns.forEach((btn, i) => {
        btn.disabled = false;
        btn.classList.remove('correct', 'wrong', 'show-correct');
        optTexts[i].textContent = shuffledOptions[i] || '—';
        btn.dataset.correct = shuffledOptions[i] === wordData.word ? 'true' : 'false';
        btn.style.opacity = '1';
      });

      // Reset timer
      gameState.timeLeft = gameState.maxTime;
      timerFill.style.width = '100%';
      timerFill.classList.remove('warning');
      timerNumber.textContent = gameState.timeLeft + 's';
      timerNumber.classList.remove('warning');

      // Start timer
      if (gameState.timer) clearInterval(gameState.timer);
      gameState.timer = setInterval(() => {
        gameState.timeLeft -= 0.1;
        const pct = Math.max(0, (gameState.timeLeft / gameState.maxTime) * 100);
        timerFill.style.width = pct + '%';
        timerNumber.textContent = Math.ceil(gameState.timeLeft) + 's';

        // Play tick sounds
        if (gameState.timeLeft <= 3) {
          timerFill.classList.add('warning');
          timerNumber.classList.add('warning');
          SoundEngine.playTickFast();
        } else if (gameState.timeLeft <= 5) {
          SoundEngine.playTick();
        }

        if (gameState.timeLeft <= 0) {
          clearInterval(gameState.timer);
          timerNumber.textContent = '0s';
          if (!gameState.answered) {
            // Time's up — auto reveal
            gameState.answered = true;
            gameState.wrong++;
            SoundEngine.playWrong();
            optionBtns.forEach(btn => {
              btn.disabled = true;
              if (btn.dataset.correct === 'true') {
                btn.classList.add('show-correct');
              }
            });
            showFeedback('⏰', 'Time\'s Up!');
            updateScore();
            setTimeout(() => {
              btnNext.classList.add('show');
            }, 800);
          }
        }
      }, 100);

      // Show second clue after 3 seconds
      setTimeout(() => {
        if (!gameState.answered) {
          clueText2.textContent = wordData.clues[1] || '—';
          clue2.classList.add('visible');
        }
      }, 3000);

      // Show third clue after 6 seconds
      setTimeout(() => {
        if (!gameState.answered) {
          clueText3.textContent = wordData.clues[2] || '—';
          clue3.classList.add('visible');
        }
      }, 6000);

      // Update thought bubble
      thoughtBubble.textContent = '🔍 Investigating...';
      thoughtBubble.classList.add('show');

      // Animate clues container
      cluesContainer.classList.remove('revealing');
      void cluesContainer.offsetWidth;
      cluesContainer.classList.add('revealing');

      btnNext.classList.remove('show');
    }

    function handleOptionClick(e) {
      const btn = e.currentTarget;
      if (btn.disabled || gameState.answered) return;

      const isCorrect = btn.dataset.correct === 'true';
      gameState.answered = true;

      // Stop timer
      if (gameState.timer) {
        clearInterval(gameState.timer);
        gameState.timer = null;
      }

      // Disable all options
      optionBtns.forEach(b => b.disabled = true);

      if (isCorrect) {
        btn.classList.add('correct');
        gameState.score += 10;
        gameState.correct++;
        SoundEngine.playCorrect();
        showFeedback('🎉', 'Correct! +10 points');
        triggerConfetti();
        // Change thought bubble
        thoughtBubble.textContent = '🎉 Brilliant!';
        thoughtBubble.classList.add('show');
      } else {
        btn.classList.add('wrong');
        gameState.wrong++;
        SoundEngine.playWrong();
        showFeedback('❌', 'Oops! Not quite...');
        // Show correct answer
        optionBtns.forEach(b => {
          if (b.dataset.correct === 'true') {
            b.classList.add('show-correct');
          }
        });
        thoughtBubble.textContent = '🤔 Keep trying!';
        thoughtBubble.classList.add('show');
      }

      updateScore();

      // Show next button
      setTimeout(() => {
        btnNext.classList.add('show');
      }, 600);
    }

    function nextWord() {
      gameState.currentIndex++;
      btnNext.classList.remove('show');
      // Hide thought bubble
      thoughtBubble.classList.remove('show');
      setTimeout(() => {
        showWord();
      }, 300);
    }

    function updateScore() {
      scoreDisplay.textContent = gameState.score;
    }

    function showFeedback(emoji, message) {
      feedbackEmoji.textContent = emoji;
      feedbackOverlay.style.display = 'flex';
      // Remove previous animation
      feedbackEmoji.style.animation = 'none';
      void feedbackEmoji.offsetWidth;
      feedbackEmoji.style.animation = 'feedbackPop 0.8s cubic-bezier(0.34, 1.56, 0.64, 1)';

      // Show message below emoji (optional)
      const msgEl = document.createElement('div');
      msgEl.textContent = message;
      msgEl.style.cssText = `
        position: absolute;
        bottom: 20%;
        left: 50%;
        transform: translateX(-50%);
        color: #fff;
        font-size: 24px;
        font-weight: 700;
        background: rgba(0,0,0,0.5);
        padding: 8px 24px;
        border-radius: 100px;
        backdrop-filter: blur(10px);
        animation: fadeIn 0.5s ease;
      `;
      msgEl.id = 'feedbackMessage';
      const oldMsg = document.getElementById('feedbackMessage');
      if (oldMsg) oldMsg.remove();
      feedbackOverlay.appendChild(msgEl);

      setTimeout(() => {
        feedbackOverlay.style.display = 'none';
        const m = document.getElementById('feedbackMessage');
        if (m) m.remove();
      }, 1200);
    }

    function endGame() {
      gameState.isGameOver = true;
      if (gameState.timer) {
        clearInterval(gameState.timer);
        gameState.timer = null;
      }

      SoundEngine.playGameOver();

      // Show game over screen
      const total = gameState.correct + gameState.wrong;
      const pct = total > 0 ? Math.round((gameState.correct / total) * 100) : 0;

      let message = '💪 Keep practicing!';
      let emoji = '📖';
      if (pct >= 90) { message = '🏆 Detective Master! Amazing!'; emoji = '🏆'; }
      else if (pct >= 70) { message = '⭐ Great Detective! Keep it up!'; emoji = '⭐'; }
      else if (pct >= 50) { message = '🔍 Good effort! You\'re getting there!'; emoji = '🔍'; }

      if (pct >= 70) {
        triggerConfetti();
        setTimeout(triggerConfetti, 1000);
      }

      const cluesList = document.getElementById('cluesList');
      cluesList.innerHTML = `
        <div class="game-over">
          <div style="font-size: 60px; margin-bottom: 10px;">${emoji}</div>
          <div class="final-message">${message}</div>
          <div class="final-score">${gameState.score}</div>
          <div class="final-label">Total Score</div>
          <div class="final-stats">
            <div class="correct-stat">
              ✅ Correct<br><span>${gameState.correct}</span>
            </div>
            <div>
              ❌ Wrong<br><span>${gameState.wrong}</span>
            </div>
            <div>
              🎯 Accuracy<br><span>${pct}%</span>
            </div>
          </div>
          <button class="btn-start" onclick="location.reload()" style="margin: 20px auto;">
            🔄 Play Again
          </button>
        </div>
      `;

      // Hide options and controls
      document.getElementById('optionsGrid').style.display = 'none';
      document.getElementById('btnStart').style.display = 'none';
      document.getElementById('btnNext').style.display = 'none';
      document.querySelector('.timer-section').style.display = 'none';
    }

    // ============================================================
    // EVENT LISTENERS
    // ============================================================
    optionBtns.forEach(btn => {
      btn.addEventListener('click', handleOptionClick);
    });

    btnStart.addEventListener('click', () => {
      SoundEngine.playStart();
      // Reset UI for a fresh game
      document.getElementById('optionsGrid').style.display = 'grid';
      document.querySelector('.timer-section').style.display = 'block';
      document.getElementById('btnStart').style.display = 'flex';
      document.getElementById('btnNext').style.display = 'none';

      // Reset clues container
      document.getElementById('cluesList').innerHTML = `
        <div class="clue-item" id="clue1">
          <span class="clue-number">🔎 CLUE 1</span>
          <span class="clue-text" id="clueText1">Press "Start" to begin the investigation!</span>
        </div>
        <div class="clue-item" id="clue2">
          <span class="clue-number">🔎 CLUE 2</span>
          <span class="clue-text" id="clueText2">—</span>
        </div>
        <div class="clue-item" id="clue3">
          <span class="clue-number">🔎 CLUE 3</span>
          <span class="clue-text" id="clueText3">—</span>
        </div>
      `;
      // Reassign refs
      Object.assign(window, {
        clueText1: document.getElementById('clueText1'),
        clueText2: document.getElementById('clueText2'),
        clueText3: document.getElementById('clueText3'),
        clue1: document.getElementById('clue1'),
        clue2: document.getElementById('clue2'),
        clue3: document.getElementById('clue3'),
      });

      startGame();
    });

    btnNext.addEventListener('click', nextWord);

    // ============================================================
    // KEYBOARD SHORTCUTS
    // ============================================================
    document.addEventListener('keydown', (e) => {
      if (e.key >= '1' && e.key <= '4') {
        const idx = parseInt(e.key) - 1;
        if (optionBtns[idx] && !optionBtns[idx].disabled) {
          optionBtns[idx].click();
        }
      }
      if (e.key === 'Enter' || e.key === ' ') {
        if (btnNext.classList.contains('show')) {
          btnNext.click();
        }
        if (!btnStart.disabled && !gameState.isRunning && !gameState.isGameOver) {
          btnStart.click();
        }
      }
    });

    // ============================================================
    // INIT
    // ============================================================
    console.log('🕵️ Mystery Word Game loaded!');
  </script>

</body>
</html>
